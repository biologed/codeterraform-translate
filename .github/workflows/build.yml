# Сборка на GitHub Actions.
#
# ЗАЧЕМ ЭТО НУЖНО ИМЕННО ЗДЕСЬ. Мод внедряет DLL в чужой процесс, поэтому
# антивирусы регулярно поднимают на него ложную тревогу, а SmartScreen ругается
# на "неизвестного издателя". Полностью это лечится только подписью файла
# сертификатом, но половину недоверия снимает возможность ПРОВЕРИТЬ, что
# выложенный бинарник собран именно из этого открытого исходного кода:
#
#   * сборка идёт на чужой машине по видимому всем сценарию;
#   * рядом с файлами лежат их SHA-256;
#   * actions/attest-build-provenance подписывает происхождение сборки, и
#     любой может проверить её командой `gh attestation verify <файл> -R <репо>`.
#
# На выходе ровно один артефакт с плоским набором файлов - тем же, что игрок
# копирует в папку игры. Раскладку собирает tools/make_release.py, чтобы она
# была одинаковой и здесь, и при локальной сборке.

name: Сборка

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Вывод скриптов на раннере уходит в пайп, а не в терминал, и Python берёт
# системную кодировку - на английской Windows это cp1252, где кириллицы нет.
# Сами скрипты от этого уже защищены (tools/_console.py), но переменная
# страхует и всё остальное: подпроцессы, сторонние утилиты, будущие шаги.
env:
  PYTHONUTF8: "1"

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    permissions:
      contents: write       # нужно, чтобы приложить архив к релизу по тегу
      id-token: write       # нужно для подписи происхождения сборки
      attestations: write

    steps:
      - uses: actions/checkout@v4

      # vcpkg на образах GitHub уже установлен, отдельно клонировать не нужно.
      - name: Настроить проект
        run: >
          cmake -B build -S . -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DTRANSLATOR_URL="${{ github.server_url }}/${{ github.repository }}"

      - name: Собрать
        run: cmake --build build --config Release

      # Складывает в release/CodeTerraform-RU/ всё, что нужно игроку, плоским
      # списком, и считает SHA256SUMS.txt.
      - name: Собрать комплект
        run: python tools/make_release.py

      # В сборках из пул-реквестов пропускаем: там нет прав на подпись
      # (id-token), и шаг упал бы, хотя сама сборка в порядке.
      - name: Подписать происхождение сборки
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            build/bin/Translator.dll
            build/bin/TranslatorLauncher.exe

      # Скачанный артефакт - это сразу нужные файлы без вложенных папок:
      # upload-artifact берёт общего родителя путей, а он здесь один.
      - name: Выложить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: CodeTerraform-RU
          path: release/CodeTerraform-RU/*

      - name: Приложить архив к релизу
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "release/CodeTerraform-RU.zip" --clobber

  test:
    name: Тест скрипта перевода
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Установить зависимости
        working-directory: tools/jstest
        run: npm ci
      - name: Прогнать тесты
        working-directory: tools/jstest
        run: npm test
